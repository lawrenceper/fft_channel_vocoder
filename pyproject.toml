[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[project]
name = "fft_channel_vocoder"
version = "1.2.0"
description = "FFT-based channel vocoder that applies spectral envelope transfer"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lawrence Perez" }]
keywords = ["vocoder", "audio", "dsp", "fft", "music"]
dependencies = [
    # add >= lower bounds for versions you have actually tested
    "numpy",
    "scipy",
    "mido",
    "librosa",
    "soundfile",
]

[project.urls]
Homepage = "https://github.com/lawrenceper/fft_channel_vocoder"

[project.scripts]
vocode = "fft_channel_vocoder.cli:cli"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
